[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamrender"
version = "0.1.20"
description = "Lightweight render farm software for Cinema 4D, Redshift, and Octane."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DreamRender" }]
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
dreamrender = "dreamrender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dreamrender = ["py.typed", "app_v2_static/*"]
