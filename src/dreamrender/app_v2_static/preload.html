<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreamRender</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      --bg: #e9e9e7;
      --shell: #f4f8f7;
      --ink: #0e0e0d;
      --muted: #687174;
      --line: #dbe5e1;
      --good: #65cd8b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(90deg, rgba(0,0,0,.08) 1px, transparent 1px) 0 0 / 50% 100%,
        linear-gradient(180deg, rgba(0,0,0,.07) 1px, transparent 1px) 0 0 / 100% 50%,
        var(--bg);
      color: var(--ink);
    }
    .loader {
      width: min(560px, calc(100vw - 48px));
      padding: 44px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--shell);
      box-shadow: 0 24px 70px rgba(18, 22, 22, .12);
      text-align: center;
    }
    h1 {
      margin: 0;
      text-transform: uppercase;
      font-size: 34px;
      letter-spacing: 0;
      line-height: 1;
    }
    p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 16px;
    }
    .spinner {
      width: 54px;
      height: 54px;
      margin: 30px auto 0;
      border-radius: 50%;
      border: 7px solid #dbe5e1;
      border-top-color: var(--good);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="loader" aria-live="polite">
    <h1>DreamRender</h1>
    <p>Starting the render farm control app...</p>
    <div class="spinner" aria-hidden="true"></div>
  </main>
</body>
</html>
